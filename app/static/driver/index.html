<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<title>Driver App</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1f2933; --muted:#62707d; --accent:#0f766e; --warn:#b45309; --bad:#b91c1c; --border:#d9dee3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111417; --card:#1b2025; --text:#e6e9ec; --muted:#9aa5b1; --border:#2d343b; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--accent); color:#fff; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:18px; margin:0; }
  main { padding:16px; max-width:560px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 10px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input { width:100%; padding:10px; font-size:16px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); }
  button { padding:11px 14px; font-size:15px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; margin:8px 8px 0 0; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button.danger { background:var(--bad); }
  button:disabled { opacity:.5; }
  .row { display:flex; justify-content:space-between; gap:8px; font-size:14px; padding:3px 0; }
  .muted { color:var(--muted); font-size:13px; }
  .pill { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; font-weight:600; background:var(--border); }
  .ok { color:var(--accent); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .hidden { display:none; }
  #msg { position:sticky; top:0; }
</style>
</head>
<body>
<header><h1>Driver App</h1><span id="net" class="pill">…</span></header>
<main>
  <div id="msg"></div>

  <section id="login" class="card hidden">
    <h2>Login</h2>
    <label for="phone">Phone number</label>
    <input id="phone" type="tel" inputmode="tel" autocomplete="tel">
    <button id="send-otp">Send OTP</button>
    <div id="otp-box" class="hidden">
      <label for="otp">OTP</label>
      <input id="otp" inputmode="numeric" maxlength="6">
      <button id="verify-otp">Verify &amp; login</button>
    </div>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <h2 id="drv-name"></h2>
      <div class="row"><span class="muted">Phone</span><span id="drv-phone"></span></div>
      <div class="row"><span class="muted">Licence</span><span id="drv-license"></span></div>
      <div class="row"><span class="muted">Vehicle</span><span id="drv-vehicle"></span></div>
      <button class="secondary" id="logout">Logout</button>
    </div>

    <div class="card">
      <h2>Location sharing</h2>
      <div class="row"><span class="muted">GPS</span><span id="gps-state">Off</span></div>
      <div class="row"><span class="muted">Last fix</span><span id="gps-last">–</span></div>
      <div class="row"><span class="muted">Waiting to sync</span><span id="queue-size">0</span></div>
      <div class="row"><span class="muted">Last synced</span><span id="last-sync">–</span></div>
      <button id="gps-toggle">Start sharing location</button>
      <p class="muted">Keep this screen open during the trip. If the internet drops, points are stored on the phone and sent automatically when it comes back.</p>
    </div>

    <div id="trips"></div>
  </section>
</main>

<template id="trip-tpl">
  <div class="card trip">
    <h2><span class="t-id"></span> <span class="pill t-status"></span></h2>
    <div class="row"><span class="muted">Shipment</span><span class="t-shp"></span></div>
    <div class="row"><span class="muted">Pickup</span><span class="t-pick"></span></div>
    <div class="row"><span class="muted">Drop</span><span class="t-drop"></span></div>
    <div class="row"><span class="muted">Distance</span><span class="t-dist"></span></div>
    <div class="actions"></div>
    <form class="pod hidden">
      <label>Receiver name</label><input name="receiver_name" required>
      <label>Receiver phone</label><input name="receiver_phone" type="tel">
      <label>Delivery OTP <span class="t-otp-req"></span></label><input name="otp" inputmode="numeric">
      <label>Photo</label><input name="photo" type="file" accept="image/*" capture="environment">
      <label>Notes</label><input name="notes">
      <button type="submit">Submit proof of delivery</button>
    </form>
  </div>
</template>

<script>
const API = location.origin;
const BATCH = 100;              // LTS batch_size
const MIN_INTERVAL_MS = 5000;   // record at most one fix every 5 s
const FLUSH_MS = 10000;
const MAX_QUEUE = 20000;
const $ = (id) => document.getElementById(id);

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { console.warn('storage', e); } },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let token = store.get('token', null);
let watchId = null, lastFixAt = 0, flushing = false, wakeLock = null, lastPos = null;

function flash(text, kind = 'ok') {
  $('msg').innerHTML = `<div class="card ${kind}">${text}</div>`;
  setTimeout(() => { $('msg').innerHTML = ''; }, 4000);
}

async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  if (token) headers.token = token;
  if (opts.json !== undefined) { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.json); }
  const res = await fetch(API + path, { method: opts.method || 'GET', headers, body: opts.body });
  if (res.status === 401 && token) { logout(); throw new Error('Session expired, please log in again'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}

// ---------- offline buffer ----------
function queue() { return store.get('ltsQueue', []); }
function enqueue(p) {
  const q = queue(); q.push(p);
  if (q.length > MAX_QUEUE) q.splice(0, q.length - MAX_QUEUE);
  store.set('ltsQueue', q); renderSync();
}
async function flush() {
  if (flushing || !token || !navigator.onLine) return;
  flushing = true;
  try {
    let q = queue();
    while (q.length) {
      const batch = q.slice(0, BATCH);
      await api('/ui/driver/location', { method: 'POST', json: batch });
      q = queue().slice(batch.length);   // re-read: new fixes may have arrived meanwhile
      store.set('ltsQueue', q);
      store.set('lastSync', new Date().toISOString());
      renderSync();
    }
  } catch (e) { console.warn('flush failed, will retry', e); }
  finally { flushing = false; }
}
function renderSync() {
  $('queue-size').textContent = queue().length;
  const ls = store.get('lastSync', null);
  $('last-sync').textContent = ls ? new Date(ls).toLocaleTimeString() : '–';
}

// ---------- GPS ----------
function onFix(pos) {
  const now = Date.now();
  lastPos = pos;
  $('gps-last').textContent = `${new Date(pos.timestamp).toLocaleTimeString()} (±${Math.round(pos.coords.accuracy)} m)`;
  if (now - lastFixAt < MIN_INTERVAL_MS) return;
  lastFixAt = now;
  enqueue({
    pt: { lat: pos.coords.latitude, lon: pos.coords.longitude },
    ts: new Date(pos.timestamp).toISOString(),
    acc: pos.coords.accuracy,
    v: pos.coords.speed,
    bear: pos.coords.heading,
  });
}
function onGpsError(err) { $('gps-state').innerHTML = `<span class="bad">${err.message}</span>`; }
async function startGps() {
  if (!('geolocation' in navigator)) return flash('This browser has no GPS access', 'bad');
  watchId = navigator.geolocation.watchPosition(onFix, onGpsError, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
  store.set('gpsOn', true);
  $('gps-state').innerHTML = '<span class="ok">On</span>';
  $('gps-toggle').textContent = 'Stop sharing location';
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
}
function stopGps() {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null; store.set('gpsOn', false);
  $('gps-state').textContent = 'Off';
  $('gps-toggle').textContent = 'Start sharing location';
  wakeLock?.release?.(); wakeLock = null;
  flush();
}

// ---------- auth ----------
async function sendOtp() {
  try {
    const r = await api('/auth/driver/otp/request', { method: 'POST', json: { phone: $('phone').value.trim() } });
    $('otp-box').classList.remove('hidden');
    flash(r.dev_otp ? `OTP sent (dev mode: ${r.dev_otp})` : 'OTP sent');
  } catch (e) { flash(e.message, 'bad'); }
}
async function verifyOtp() {
  try {
    const r = await api('/auth/driver/otp/verify', { method: 'POST', json: { phone: $('phone').value.trim(), otp: $('otp').value.trim() } });
    token = r.token; store.set('token', token); boot();
  } catch (e) { flash(e.message, 'bad'); }
}
function logout() {
  stopGps(); token = null; store.del('token');
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
}

// ---------- trips ----------
const NEXT = {
  ASSIGNED: [['PICKED_UP', 'Goods picked up'], ['STARTED', 'Start trip']],
  PICKED_UP: [['STARTED', 'Start trip']],
  STARTED: [['REACHED', 'Reached destination']],
  IN_TRANSIT: [['REACHED', 'Reached destination']],
};
function here() { return lastPos ? { lat: lastPos.coords.latitude, lon: lastPos.coords.longitude } : {}; }

async function setStatus(tripId, status) {
  try {
    if (status === 'STARTED' && watchId === null) await startGps();
    await flush();
    await api(`/driver/trips/${tripId}/status`, { method: 'POST', json: Object.assign({ status }, here()) });
    loadTrips();
  } catch (e) { flash(e.message, 'bad'); }
}

async function submitPod(tripId, form) {
  const fd = new FormData(form);
  const pos = here();
  if (pos.lat !== undefined) { fd.append('lat', pos.lat); fd.append('lon', pos.lon); }
  if (!fd.get('photo') || !fd.get('photo').size) fd.delete('photo');
  try {
    await flush();
    const res = await fetch(`${API}/driver/trips/${tripId}/pod`, { method: 'POST', headers: { token }, body: fd });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || res.statusText);
    flash('Delivered. Thank you!');
    loadTrips();
  } catch (e) { flash(e.message, 'bad'); }
}

async function loadTrips() {
  const box = $('trips');
  let trips;
  try { trips = await api('/driver/trips'); } catch (e) { return flash(e.message, 'bad'); }
  box.innerHTML = trips.length ? '' : '<div class="card muted">No trips assigned.</div>';
  for (const t of trips) {
    const el = $('trip-tpl').content.firstElementChild.cloneNode(true);
    el.querySelector('.t-id').textContent = t.id;
    el.querySelector('.t-status').textContent = t.status.replace('_', ' ');
    el.querySelector('.t-shp').textContent = `${t.shipment.id} · ${t.shipment.customer_name}`;
    el.querySelector('.t-pick').textContent = t.shipment.pickup.address;
    el.querySelector('.t-drop').textContent = t.shipment.drop.address;
    el.querySelector('.t-dist').textContent = `${t.distance_km} km driven / ${t.planned_distance_km ?? '?'} km planned`;
    el.querySelector('.t-otp-req').textContent = t.shipment.require_otp ? '(required)' : '(optional)';
    const actions = el.querySelector('.actions');
    for (const [st, label] of NEXT[t.status] || []) {
      const b = document.createElement('button'); b.textContent = label;
      b.onclick = () => setStatus(t.id, st); actions.appendChild(b);
    }
    if (['STARTED', 'IN_TRANSIT', 'REACHED'].includes(t.status)) {
      const b = document.createElement('button'); b.textContent = 'Deliver (POD)';
      const form = el.querySelector('.pod');
      b.onclick = () => form.classList.toggle('hidden');
      form.onsubmit = (ev) => { ev.preventDefault(); submitPod(t.id, form); };
      actions.appendChild(b);
    }
    box.appendChild(el);
  }
}

async function boot() {
  renderNet();
  if (!token) { $('login').classList.remove('hidden'); return; }
  try {
    const me = await api('/driver/me');
    $('drv-name').textContent = me.name;
    $('drv-phone').textContent = me.phone;
    $('drv-license').textContent = me.license_no || '–';
    $('drv-vehicle').textContent = me.vehicle ? `${me.vehicle.reg_no} (${me.vehicle.vehicle_type})` : 'Not assigned';
  } catch (e) {
    if (!token) return;
    flash('Offline – showing cached session', 'warn');
  }
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  renderSync();
  if (store.get('gpsOn', false) && watchId === null) startGps();
  loadTrips();
}

function renderNet() {
  $('net').textContent = navigator.onLine ? 'Online' : 'Offline';
  $('net').style.background = navigator.onLine ? '#0d9488' : '#b45309';
}

$('send-otp').onclick = sendOtp;
$('verify-otp').onclick = verifyOtp;
$('logout').onclick = logout;
$('gps-toggle').onclick = () => (watchId === null ? startGps() : stopGps());
window.addEventListener('online', () => { renderNet(); flush(); });
window.addEventListener('offline', renderNet);
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible') {
    if (watchId !== null && !wakeLock) { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {} }
    flush();
  }
});
setInterval(flush, FLUSH_MS);
setInterval(() => { if (token && navigator.onLine && !$('app').classList.contains('hidden')) loadTrips(); }, 30000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
</script>
</body>
</html>
